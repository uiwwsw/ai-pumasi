name: Build and test
on:
  # Not on every commit: run by hand when needed, plus once a week.
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 1'
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm test
