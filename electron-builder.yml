appId: com.uiwwsw.aurora
productName: Pumasi Agent
asar: true
compression: normal
directories:
  output: distribution/${version}
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - src/catalog.json
  - src/ensemble-weights.json
  - src/i18n/**/*
  - package.json
  - "!**/.env*"
  - "!**/artifacts/**"
  - "!**/tests/**"
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: build/icon.png
  notarize: false
  artifactName: Pumasi-Agent-${version}-mac-${arch}.${ext}
dmg:
  title: Pumasi Agent ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 430
      y: 190
      type: link
      path: /Applications
win:
  target: [nsis]
  icon: build/icon.png
  artifactName: Pumasi-Agent-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
publish:
  provider: github
  owner: uiwwsw
  repo: pumasi-agent
  releaseType: release
# Always write latest*.yml, also for alpha and beta builds. The updater picks the release by tag
# (see electron/updates.cjs) and reads latest*.yml from it.
detectUpdateChannel: false
